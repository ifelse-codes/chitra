blank_issues_enabled: false
contact_links:
  - name: Documentation
    url: https://chitra.iifelse.com
    about: Chart gallery, guides, and the AI data reference — most questions are answered here.
  - name: API reference
    url: https://www.npmjs.com/package/@ifelse.codes/chitra
    about: "The package README is the API reference: every chart's options, with examples."
  - name: Security vulnerability
    url: https://github.com/ifelse-codes/chitra/security/advisories/new
    about: >-
      Report a suspected vulnerability privately, if this repository has private
      reporting switched on. If the link does not work, the private channel does not exist
      yet: open a bug report containing nothing but "a security report is pending" and a
      request for a private route — no version, no reproduction, no detail. Never post exploit
      details publicly. The settings behind this are recorded in .github/REPO-SETTINGS.md.
