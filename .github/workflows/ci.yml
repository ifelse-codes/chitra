name: CI

# Session 07 — the gates that must stay green (see .ai/ROADMAP.md guardrails):
#   core:  @ifelse.codes/chitra test (452) + typecheck + dist build (ESM + CJS + .d.ts)
#   docs:  @workspace/chitra-docs typecheck + build
#   drift: generated chart previews match the spec source (gen:charts:check)
# Toolchain is pinned to the versions proven green locally (Node 26, pnpm 9.12.3,
# lockfile v9.0); bump both here and in scripts/verify-session-07.sh together.

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "26"
  PNPM_VERSION: "9.12.3"

jobs:
  core:
    name: core · test + typecheck + build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - name: Install (frozen lockfile)
        run: pnpm install --frozen-lockfile
      - name: Test
        run: pnpm --filter @ifelse.codes/chitra run test
      - name: Typecheck
        run: pnpm --filter @ifelse.codes/chitra run typecheck
      - name: Build dist (ESM + CJS + .d.ts)
        run: pnpm --filter @ifelse.codes/chitra run build
      # S41 req. 2: VERSION is injected from package.json at build time, so this
      # is the check that would have caught the literal "0.1.0" that shipped
      # inside dist/ while the manifest said 0.3.0. Behavioural, not a grep.
      - name: VERSION in dist matches the manifest
        run: |
          DIST=$(node -e "import('./packages/core/dist/index.js').then(m => console.log(m.VERSION))")
          MANIFEST=$(node -p "require('./packages/core/package.json').version")
          if [ "$DIST" != "$MANIFEST" ]; then
            echo "VERSION drift - dist says $DIST, manifest says $MANIFEST"
            exit 1
          fi
          echo "VERSION $DIST == manifest"

  docs:
    name: docs · typecheck + build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - name: Install (frozen lockfile)
        run: pnpm install --frozen-lockfile
      # docs tsconfig references lib/ projects whose declaration output is not
      # in git; build them first or a fresh clone fails typecheck.
      - name: Build lib type declarations
        run: pnpm run typecheck:libs
      # S11: the docs app imports @ifelse.codes/chitra at runtime, and core resolves through
      # dist/ (gitignored). Without this the docs typecheck fails on a fresh clone
      # with TS2307 while passing on any machine that happens to have a built dist.
      - name: Build @ifelse.codes/chitra (docs imports it)
        run: pnpm --filter @ifelse.codes/chitra run build
      - name: Typecheck
        run: pnpm --filter @workspace/chitra-docs run typecheck
      - name: Build
        run: pnpm --filter @workspace/chitra-docs run build
        env:
          PORT: "5000"
          BASE_PATH: "/"

  chart-drift:
    name: drift · generated charts match spec
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - name: Install (frozen lockfile)
        run: pnpm install --frozen-lockfile
      - name: Chart generation drift check
        run: pnpm --filter @workspace/chitra-docs run gen:charts:check

  browser-qa:
    name: qa · browser QA (all catalog pages)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - name: Install (frozen lockfile)
        run: pnpm install --frozen-lockfile
      # qa-catalog.mjs builds the docs app itself; it resolves @ifelse.codes/chitra
      # through dist/ (gitignored) and the lib declarations, so build both first.
      - name: Build lib type declarations
        run: pnpm run typecheck:libs
      - name: Build @ifelse.codes/chitra (docs imports it)
        run: pnpm --filter @ifelse.codes/chitra run build
      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium
      # Visits all 20 chart pages + docs pages + home; fails on any console or
      # page error, missing terminal output, or broken persistence/run shortcut.
      - name: Browser QA (charts + docs, zero console errors)
        run: node scripts/qa-catalog.mjs
        env:
          PORT: "5174"
          BASE_PATH: "/"
