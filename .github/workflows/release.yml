name: Release

# Session 08 — publish @chitra/core to npm on a v* tag push.
# Depends on the same three CI gates from ci.yml (core · docs · chart-drift).
# The publish job runs only after all three gates pass.
# Toolchain versions must stay in sync with ci.yml (Node 26, pnpm 9.12.3).

on:
  push:
    tags:
      - "v*"

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  NODE_VERSION: "26"
  PNPM_VERSION: "9.12.3"

jobs:
  core:
    name: core · test + typecheck + build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - name: Install (frozen lockfile)
        run: pnpm install --frozen-lockfile
      - name: Test
        run: pnpm --filter @chitra/core run test
      - name: Typecheck
        run: pnpm --filter @chitra/core run typecheck
      - name: Build dist (ESM + CJS + .d.ts)
        run: pnpm --filter @chitra/core run build

  docs:
    name: docs · typecheck + build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - name: Install (frozen lockfile)
        run: pnpm install --frozen-lockfile
      - name: Build lib type declarations
        run: pnpm run typecheck:libs
      - name: Typecheck
        run: pnpm --filter @workspace/chitra-docs run typecheck
      - name: Build
        run: pnpm --filter @workspace/chitra-docs run build
        env:
          PORT: "5000"
          BASE_PATH: "/"

  chart-drift:
    name: drift · generated charts match spec
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - name: Install (frozen lockfile)
        run: pnpm install --frozen-lockfile
      - name: Chart generation drift check
        run: pnpm --filter @workspace/chitra-docs run gen:charts:check

  publish:
    name: publish · @chitra/core → npm
    runs-on: ubuntu-latest
    needs: [core, docs, chart-drift]
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          registry-url: "https://registry.npmjs.org"
      - name: Install (frozen lockfile)
        run: pnpm install --frozen-lockfile
      - name: Build dist (ESM + CJS + .d.ts)
        run: pnpm --filter @chitra/core run build
      - name: Publish to npm
        run: pnpm --filter @chitra/core publish --access public --no-git-checks
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NODE_AUTH_TOKEN }}
