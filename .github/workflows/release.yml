name: Release

# Session 08 — publish @ifelse.codes/core to npm on a v* tag push.
# Depends on the same three CI gates from ci.yml (core · docs · chart-drift).
# The publish job runs only after all three gates pass.
# Toolchain versions must stay in sync with ci.yml (Node 26, pnpm 9.12.3).

on:
  push:
    tags:
      - "v*"

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  NODE_VERSION: "26"
  PNPM_VERSION: "9.12.3"

jobs:
  core:
    name: core · test + typecheck + build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - name: Install (frozen lockfile)
        run: pnpm install --frozen-lockfile
      - name: Test
        run: pnpm --filter @ifelse.codes/core run test
      - name: Typecheck
        run: pnpm --filter @ifelse.codes/core run typecheck
      - name: Build dist (ESM + CJS + .d.ts)
        run: pnpm --filter @ifelse.codes/core run build

  docs:
    name: docs · typecheck + build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - name: Install (frozen lockfile)
        run: pnpm install --frozen-lockfile
      - name: Build lib type declarations
        run: pnpm run typecheck:libs
      # docs imports @ifelse.codes/core, which resolves through dist/ (gitignored);
      # without this a fresh clone fails typecheck with TS2307 (mirrors ci.yml).
      - name: Build @ifelse.codes/core (docs imports it)
        run: pnpm --filter @ifelse.codes/core run build
      - name: Typecheck
        run: pnpm --filter @workspace/chitra-docs run typecheck
      - name: Build
        run: pnpm --filter @workspace/chitra-docs run build
        env:
          PORT: "5000"
          BASE_PATH: "/"

  chart-drift:
    name: drift · generated charts match spec
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - name: Install (frozen lockfile)
        run: pnpm install --frozen-lockfile
      - name: Chart generation drift check
        run: pnpm --filter @workspace/chitra-docs run gen:charts:check

  publish:
    name: publish · @ifelse.codes/core → npm
    runs-on: ubuntu-latest
    needs: [core, docs, chart-drift]
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          registry-url: "https://registry.npmjs.org"
      - name: Install (frozen lockfile)
        run: pnpm install --frozen-lockfile
      - name: Build dist (ESM + CJS + .d.ts)
        run: pnpm --filter @ifelse.codes/core run build
      - name: Publish to npm (skip if this version already exists)
        run: |
          VERSION="$(node -p "require('./packages/core/package.json').version")"
          if npm view "@ifelse.codes/core@${VERSION}" version >/dev/null 2>&1; then
            echo "::notice title=already published::@ifelse.codes/core@${VERSION} is already on npm — skipping publish (idempotent tag push)."
            exit 0
          fi
          pnpm --filter @ifelse.codes/core publish --access public --no-git-checks
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NODE_AUTH_TOKEN }}
