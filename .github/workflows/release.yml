name: Release

# Session 08 — publish @ifelse.codes/chitra to npm on a v* tag push.
# Session 38 — the publish job now uses npm Trusted Publishing (OIDC), not a
#   long-lived NODE_AUTH_TOKEN. It needs NO npm secret at all: GitHub mints an
#   OIDC token (`id-token: write`) and npm exchanges it for a short-lived publish
#   token. Requires npm >= 11.5.1 / Node >= 22.14.0, and the `core` job's
#   pnpm pin stays only for install/build/test (pnpm cannot do OIDC).
# Depends on the same three CI gates from ci.yml (core · docs · chart-drift).
# The publish job runs only after all three gates pass.
# Toolchain versions must stay in sync with ci.yml (Node 26, pnpm 9.12.3).

on:
  push:
    tags:
      - "v*"

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  NODE_VERSION: "26"
  PNPM_VERSION: "9.12.3"

jobs:
  core:
    name: core · test + typecheck + build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - name: Install (frozen lockfile)
        run: pnpm install --frozen-lockfile
      - name: Test
        run: pnpm --filter @ifelse.codes/chitra run test
      - name: Typecheck
        run: pnpm --filter @ifelse.codes/chitra run typecheck
      - name: Build dist (ESM + CJS + .d.ts)
        run: pnpm --filter @ifelse.codes/chitra run build

  docs:
    name: docs · typecheck + build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - name: Install (frozen lockfile)
        run: pnpm install --frozen-lockfile
      - name: Build lib type declarations
        run: pnpm run typecheck:libs
      # docs imports @ifelse.codes/chitra, which resolves through dist/ (gitignored);
      # without this a fresh clone fails typecheck with TS2307 (mirrors ci.yml).
      - name: Build @ifelse.codes/chitra (docs imports it)
        run: pnpm --filter @ifelse.codes/chitra run build
      - name: Typecheck
        run: pnpm --filter @workspace/chitra-docs run typecheck
      - name: Build
        run: pnpm --filter @workspace/chitra-docs run build
        env:
          PORT: "5000"
          BASE_PATH: "/"

  chart-drift:
    name: drift · generated charts match spec
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - name: Install (frozen lockfile)
        run: pnpm install --frozen-lockfile
      - name: Chart generation drift check
        run: pnpm --filter @workspace/chitra-docs run gen:charts:check

  publish:
    name: publish · @ifelse.codes/chitra → npm
    runs-on: ubuntu-latest
    needs: [core, docs, chart-drift]
    permissions:
      # S38 — Trusted Publishing (OIDC). `id-token: write` lets GitHub mint the OIDC
      # token npm exchanges for a short-lived publish token; this job therefore needs
      # NO long-lived npm secret. Provenance is NOT produced: the GitHub repo is
      # private, and npm does not generate provenance for private repos even under
      # trusted publishing (a known npm limitation). Making the repo public would turn
      # provenance on — a founder decision, not a workflow one.
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          # S38 — no pnpm store cache in the release job (the `cache:` key is omitted
          # entirely, as in npm's own Trusted Publishing example: "never use caching in
          # release builds"). The store is restored into the very tree we publish from,
          # so this job rebuilds dist from a clean store. The test jobs keep their cache.
          registry-url: "https://registry.npmjs.org"
      - name: Install (frozen lockfile)
        run: pnpm install --frozen-lockfile
      - name: Build dist (ESM + CJS + .d.ts)
        run: pnpm --filter @ifelse.codes/chitra run build
      - name: Publish to npm via Trusted Publishing (OIDC) — skip if version exists
        run: |
          VERSION="$(node -p "require('./packages/core/package.json').version")"
          if npm view "@ifelse.codes/chitra@${VERSION}" version >/dev/null 2>&1; then
            echo "::notice title=already published::@ifelse.codes/chitra@${VERSION} is already on npm — skipping publish (idempotent tag push)."
            exit 0
          fi
          # S38 — `npm publish`, NOT `pnpm publish`. pnpm is pinned at 9.12.3, which
          # predates npm Trusted Publishing and only supports token auth (_authToken /
          # _auth / tokenHelper); it cannot exchange an OIDC token. npm >= 11.5.1 can.
          # pnpm still does install/build/test here; only the publish step uses npm.
          cd packages/core
          npm publish --access public
